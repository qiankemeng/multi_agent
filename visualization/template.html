<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频问答Multi-Agent系统可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        header h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2em;
            color: #666;
        }
        .tabs {
            display: flex;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            background: #f5f7fa;
            border: none;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }
        .tab:hover {
            background: #e8ecf2;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .content-panel {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
        }
        .content-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        h3 {
            color: #555;
            margin: 20px 0 10px;
        }
        .agent-cards, .op-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .card {
            border: 2px solid #e8ecf2;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 5px 5px 5px 0;
        }
        .badge-primary { background: #667eea; color: white; }
        .badge-success { background: #50C878; color: white; }
        .badge-info { background: #4A90E2; color: white; }
        .workflow-step {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #f5f7fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .step-number {
            width: 40px;
            height: 40px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .step-content {
            flex: 1;
        }
        .step-content strong {
            color: #667eea;
        }
        .example-box {
            background: #f8f9fa;
            border-left: 4px solid #50C878;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .metric {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .sequence-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 8px;
        }
        .seq-num {
            width: 30px;
            height: 30px;
            background: #4A90E2;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85em;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .arrow { font-size: 1.2em; margin: 0 10px; color: #667eea; }
        code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            display: block;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 10px 0;
        }
        ul { padding-left: 20px; }
        li { margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 视频问答 Multi-Agent 系统</h1>
            <p id="project-desc">长视频理解的智能代理系统</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab(0)">📊 系统架构</button>
            <button class="tab" onclick="showTab(1)">🔄 工作流程</button>
            <button class="tab" onclick="showTab(2)">⚙️ 原子操作</button>
            <button class="tab" onclick="showTab(3)">📝 实际案例</button>
            <button class="tab" onclick="showTab(4)">🔗 Agent交互</button>
        </div>

        <div id="tab-0" class="content-panel active">
            <h2>系统架构</h2>
            <div id="agents-section"></div>
            <div id="architecture-section"></div>
        </div>

        <div id="tab-1" class="content-panel">
            <h2>视频问答完整工作流</h2>
            <div id="workflow-section"></div>
        </div>

        <div id="tab-2" class="content-panel">
            <h2>四个核心原子操作</h2>
            <div id="operations-section"></div>
            <h3>原子操作组合示例</h3>
            <div id="composition-section"></div>
        </div>

        <div id="tab-3" class="content-panel">
            <h2>实际应用案例</h2>
            <div id="example-section"></div>
        </div>

        <div id="tab-4" class="content-panel">
            <h2>Agent交互时序</h2>
            <div id="sequence-section"></div>
        </div>
    </div>

    <script>
        let mainData, interactionSeq, compositionExamples;

        async function loadData() {
            try {
                const [main, interaction, composition] = await Promise.all([
                    fetch('data/main_data.json').then(r => r.json()),
                    fetch('data/interaction_sequence.json').then(r => r.json()),
                    fetch('data/composition_examples.json').then(r => r.json())
                ]);
                mainData = main;
                interactionSeq = interaction;
                compositionExamples = composition;
                renderAll();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.querySelector('.container').innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">数据加载失败，请确保数据文件存在</h2>';
            }
        }

        function showTab(index) {
            document.querySelectorAll('.tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.content-panel').forEach((panel, i) => {
                panel.classList.toggle('active', i === index);
            });
        }

        function renderAll() {
            document.getElementById('project-desc').textContent = mainData.project_info.description;
            renderAgents();
            renderArchitecture();
            renderWorkflow();
            renderOperations();
            renderComposition();
            renderExample();
            renderSequence();
        }

        function renderAgents() {
            const html = `
                <h3>🤖 核心智能代理</h3>
                <div class="agent-cards">
                    ${mainData.agents.map(agent => `
                        <div class="card" style="border-color: ${agent.color};">
                            <h3 style="color: ${agent.color};">${agent.name}</h3>
                            <p><strong>角色：</strong>${agent.role}</p>
                            <p>${agent.description}</p>
                            <p><strong>能力：</strong></p>
                            <div>${agent.capabilities.map(cap => `<span class="badge badge-info">${cap}</span>`).join('')}</div>
                            <p style="margin-top:10px;"><strong>模型：</strong> ${agent.mllm_model}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('agents-section').innerHTML = html;
        }

        function renderArchitecture() {
            const arch = mainData.system_architecture;
            const html = `
                <h3>🏗️ 系统分层架构</h3>
                ${arch.layers.map((layer, i) => `
                    <div class="example-box">
                        <h4>${i+1}. ${layer.name}</h4>
                        <p><strong>${layer.description}</strong></p>
                        <div>${layer.components.map(c => `<span class="badge badge-primary">${c}</span>`).join('')}</div>
                    </div>
                `).join('')}
                <h3>✨ 系统特性</h3>
                <ul>
                    ${arch.key_features.map(f => `<li>${f}</li>`).join('')}
                </ul>
            `;
            document.getElementById('architecture-section').innerHTML = html;
        }

        function renderWorkflow() {
            const html = mainData.workflow.map(step => `
                <div class="workflow-step">
                    <div class="step-number">${step.step_num}</div>
                    <div class="step-content">
                        <strong>${step.name}</strong>
                        <p>${step.description}</p>
                        <p style="font-size:0.9em;color:#666;margin-top:5px;">
                            操作: <code style="display:inline;padding:2px 6px;font-size:0.85em;">${step.operation}</code> | 
                            输入: ${step.input_data} → 输出: ${step.output_data}
                        </p>
                    </div>
                </div>
            `).join('');
            document.getElementById('workflow-section').innerHTML = html;
        }

        function renderOperations() {
            const html = `
                <div class="op-cards">
                    ${mainData.atomic_operations.map(op => `
                        <div class="card">
                            <h3>🔧 ${op.name}</h3>
                            <p>${op.description}</p>
                            <p><strong>输入:</strong> <code style="display:inline;padding:2px 6px;font-size:0.85em;">${op.input_type}</code></p>
                            <p><strong>输出:</strong> <code style="display:inline;padding:2px 6px;font-size:0.85em;">${op.output_type}</code></p>
                            ${op.methods.length > 0 ? `
                                <p><strong>方法:</strong></p>
                                <ul>
                                    ${op.methods.map(m => `<li><strong>${m.name}:</strong> ${m.desc}</li>`).join('')}
                                </ul>
                            ` : ''}
                            <p><strong>示例:</strong></p>
                            <ul style="font-size:0.9em;">
                                ${op.examples.map(ex => `<li>${ex}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('operations-section').innerHTML = html;
        }

        function renderComposition() {
            const html = compositionExamples.map((ex, i) => `
                <div class="example-box" style="border-color:${['#667eea','#50C878','#4A90E2','#764ba2'][i%4]};">
                    <h4>${i+1}. ${ex.name}</h4>
                    <p>${ex.description}</p>
                    <p><strong>组合:</strong> ${ex.composition.map(c => `<span class="badge badge-success">${c}</span>`).join(' → ')}</p>
                    <p><strong>用例:</strong> ${ex.use_case}</p>
                    <code>${ex.code_sketch}</code>
                </div>
            `).join('');
            document.getElementById('composition-section').innerHTML = html;
        }

        function renderExample() {
            const ex = mainData.example_scenario;
            const html = `
                <h3>📺 ${ex.title}</h3>
                <div class="example-box">
                    <h4>视频信息</h4>
                    <p><strong>标题:</strong> ${ex.video.title}</p>
                    <p><strong>时长:</strong> ${ex.video.duration}</p>
                    <p><strong>片段数:</strong> ${ex.video.segments}</p>
                    <p><strong>用户问题:</strong> "${ex.video.question}"</p>
                </div>
                <h3>处理步骤</h3>
                ${ex.processing_steps.map((step, i) => `
                    <div class="workflow-step">
                        <div class="step-number">${i+1}</div>
                        <div class="step-content">
                            <strong>${step.step}</strong>
                            <p>动作: ${step.action}</p>
                            <p>结果: ${step.result}</p>
                        </div>
                    </div>
                `).join('')}
                <h3>性能指标</h3>
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-value">${ex.metrics.total_api_calls}</div>
                        <div class="metric-label">API调用次数</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${ex.metrics.total_frames_analyzed}</div>
                        <div class="metric-label">分析帧数</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${ex.metrics.estimated_tokens}</div>
                        <div class="metric-label">Token用量</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${ex.metrics.estimated_cost}</div>
                        <div class="metric-label">预估成本</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${ex.metrics.processing_time}</div>
                        <div class="metric-label">处理时间</div>
                    </div>
                </div>
            `;
            document.getElementById('example-section').innerHTML = html;
        }

        function renderSequence() {
            const html = interactionSeq.map(item => `
                <div class="sequence-item">
                    <div class="seq-num">${item.seq}</div>
                    <div style="flex:1;">
                        <strong>${item.from}</strong>
                        <span class="arrow">→</span>
                        <strong>${item.to}</strong>
                        <p style="margin-top:5px;color:#666;">${item.message}</p>
                        <span class="badge ${item.type === 'api_call' ? 'badge-primary' : item.type === 'response' ? 'badge-success' : 'badge-info'}">${item.type}</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('sequence-section').innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
